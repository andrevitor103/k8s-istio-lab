apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: catalog
  namespace: lab
spec:
  host: catalog.lab.svc.cluster.local
  trafficPolicy:
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 1s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
