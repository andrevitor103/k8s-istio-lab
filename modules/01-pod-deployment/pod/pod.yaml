apiVersion: v1
kind: Pod
metadata:
  name: catalog
  namespace: lab
  labels:
    app: catalog
    version: v1
spec:
  containers:
    - name: catalog
      image: catalog:lab
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
      env:
        - name: VERSION
          value: v1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
