apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: lab
  labels:
    app: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        version: v1
    spec:
      containers:
        - name: storefront
          image: storefront:lab
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CATALOG_URL
              valueFrom:
                configMapKeyRef:
                  name: storefront
                  key: CATALOG_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
