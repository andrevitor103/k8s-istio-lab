apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: lab
spec:
  ingressClassName: nginx
  rules:
    - host: store.lab.test
      http:
        paths:
          - path: /items
            pathType: Prefix
            backend:
              service:
                name: catalog
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 8080
